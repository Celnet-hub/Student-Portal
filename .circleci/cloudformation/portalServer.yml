Description: >
  Student Portal Server stack.

Parameters:
  ID:
    Description: Unique identifier.
    Type: String

  EnvironmentName:
    Description: An environment name that will be prefixed to resource name
    Type: String
    Default: StudentPortalCICDProject


Resources:
  InstanceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub studentportal-${ID}
      GroupDescription: Allow port 3000, port 8080 and port 8000
      VpcId: !ImportValue
        "Fn::Sub": "${EnvironmentName}-VPCID" 
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 3000
          ToPort: 3000
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 8000
          ToPort: 8000
          CidrIp: 0.0.0.0/0
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 0
          ToPort: 65535
          CidrIp: 0.0.0.0/0

  EC2Instance:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: t2.micro
      VpcId: !ImportValue
        "Fn::Sub": "${EnvironmentName}-VPCID" 
      SecurityGroups:
        - !Ref InstanceSecurityGroup
      KeyName: studentportal
      ImageId: ami-058bd2d568351da34
      SubnetId: !ImportValue
        "Fn::Sub": "${EnvironmentName}-PUB-NETS"
      Tags:
        - Key: Name
          Value: !Sub studentportalServer-${ID}

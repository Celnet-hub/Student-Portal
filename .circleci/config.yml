version: 2.1

jobs:
  build-Frontend:
    docker:
      - image: circleci/node:14
    steps:
      - checkout
      - run:
          name: Install Frontend dependencies
          command: |
            cd Frontend
            npm install
      - run:
          name: Build Frontend
          command: |
            cd Frontend
            CI= npm run build
      - persist_to_workspace:
          root: .
          paths:
            - Frontend/build

  build-Backend:
    docker:
      - image: circleci/python:3.8
    steps:
      - checkout
      - setup_remote_docker:
          version: 20.10.7
      - run:
          name: Install Backend dependencies
          command: |
            cd Backend
            pip install -r requirements.txt
      - run:
          name: Collect static files
          command: |
            cd Backend
            python manage.py collectstatic --noinput
      - persist_to_workspace:
          root: .
          paths:
            - Backend

  deploy:
    docker:
      - image: circleci/python:3.8
    steps:
      - attach_workspace:
          at: ~/project
      - run:
          name: Deploy
          command: |
            cd ~/project/Backend
            # Add your deployment commands here
            # For example, using SSH to transfer files or using a deployment tool like Heroku CLI
            # Example:
            # scp -r /workspace/Backend yourserver:/path/to/deploy
            # scp -r /workspace/Frontend/build yourserver:/path/to/deploy/static

workflows:
  version: 2
  build-and-deploy:
    jobs:
      - build-Frontend
      - build-Backend:
          requires:
            - build-Frontend
      - deploy:
          requires:
            - build-Backend

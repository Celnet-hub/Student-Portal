version: '3.9'

# defines services
services:
  db:
    image: postgres:14-alpine
    # image: celnet1/studentportal-db:lastest
    ports:
      - '5432:5432'
    environment:
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_DB=postgres
    volumes:
      - ./data/db:/var/lib/postgresql/data/
    networks:
      - portal-network
    secrets:
      - db_pass

  reactfrontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    # image: celnet1/studentportal-fe:lastest
    ports:
      - '80:3000'
    # volumes:
    #   - ./Frontend:/app/frontend
    depends_on:
      - pybackend
    networks:
      - portal-network

  pybackend: 
    build: 
      context: ./Backend
      dockerfile: Dockerfile
    # image: celnet1/studentportal-py-be:lastest
    environment:
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_DB=postgres
    ports:
      - '8000:8000'
    volumes:
      - ./Backend:/app/backend
    depends_on:
      - db
    networks:
      - portal-network
    secrets:
      - db_pass

  # used to have a UI for the database  
  adminer:
    image: adminer
    restart: always
    depends_on:
      - db
    ports:
      - 8080:8080
    networks:
      - portal-network

secrets:
  db_pass:
    file: ''

networks:
  portal-network:
    driver: bridge